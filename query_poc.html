<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計數據查詢</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px; }
    p.subtitle { font-size: 14px; color: #888; margin-bottom: 28px; }
    textarea {
      width: 100%;
      height: 110px;
      padding: 14px 16px;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a2e;
      border: 1.5px solid #dde3ec;
      border-radius: 8px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }
    textarea::placeholder { color: #bbb; }
    textarea:focus { border-color: #4a7fcb; }
    button.query-btn {
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #4a7fcb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.query-btn:hover { background: #3a6abf; }
    button.query-btn:disabled { background: #a0b8e0; cursor: not-allowed; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 32px 28px 24px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }
    .modal h2 {
      font-size: 16px;
      font-weight: 600;
      color: #888;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #dde3ec;
      border-top-color: #4a7fcb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal p {
      font-size: 14px;
      color: #333;
      line-height: 1.8;
      margin-bottom: 24px;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      background: #fdfdfd;
      padding: 10px;
      border-radius: 6px;
    }
    .modal button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #4a7fcb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
